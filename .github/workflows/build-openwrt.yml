name: Build ImmortalWrt 25.12 Test for WR30U

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wr30u-25.12-test
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: "25.12"
  TZ: Asia/Shanghai

jobs:
  resolve-source:
    runs-on: ubuntu-22.04
    outputs:
      source_commit: ${{ steps.resolve.outputs.source_commit }}
    steps:
      - name: Checkout test configuration
        uses: actions/checkout@v4

      - name: Resolve 25.12 source revision
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print $1}')"
          test -n "$source_commit"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "25.12 source: $source_commit"

  build-test:
    needs: resolve-source
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout test configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip-full \
            patch pkgconf python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -hT

      - name: Clone pinned 25.12 source
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_commit }}
        run: |
          git init openwrt
          git -C openwrt remote add origin "$REPO_URL"
          git -C openwrt fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Apply source customization
        run: bash diy-part1.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate and validate 25.12 configuration
        run: |
          cd openwrt
          perl scripts/kconfig.pl + \
            defconfig/mt7981-ax3000.config \
            "$GITHUB_WORKSPACE/config/custom.config" > .config
          bash "$GITHUB_WORKSPACE/diy-part2.sh" "$PWD"
          sha256sum .config
          grep -qx 'CONFIG_USE_APK=y' .config
          grep -qx 'CONFIG_PACKAGE_apk-openssl=y' .config
          if ! cmp -s .config "$GITHUB_WORKSPACE/.config"; then
            echo "::warning::Generated .config differs from the committed 25.12 snapshot."
          fi

      - name: Verify WR30U U-Boot Mod image contract
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          image_makefile=target/linux/mediatek/image/filogic.mk
          dts=target/linux/mediatek/dts/mt7981b-xiaomi-mi-router-wr30u-ubootmod.dts
          grep -A35 '^define Device/xiaomi_mi-router-wr30u-ubootmod$' "$image_makefile" > /tmp/wr30u-image.txt
          grep -q 'IMAGES := sysupgrade.itb' /tmp/wr30u-image.txt
          grep -q 'KERNEL_IN_UBI := 1' /tmp/wr30u-image.txt
          grep -q 'UBOOTENV_IN_UBI := 1' /tmp/wr30u-image.txt
          grep -q 'reg = <0x600000 0x7000000>;' "$dts"
          grep -q 'root=/dev/fit0' "$dts"

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete

      - name: Compile test firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect test release firmware
        id: collect
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/openwrt/bin/targets/mediatek/filogic"
          release_dir="$GITHUB_WORKSPACE/release"
          device_prefix="immortalwrt-mediatek-filogic-xiaomi_mi-router-wr30u-ubootmod"
          test -d "$output_dir"
          mkdir -p "$release_dir"
          find "$output_dir" -maxdepth 1 -type f \
            -name "${device_prefix}*sysupgrade.itb" \
            -exec cp -t "$release_dir" -- {} +
          image_count="$(find "$release_dir" -maxdepth 1 -type f -name '*sysupgrade.itb' | wc -l)"
          if [[ "$image_count" -ne 1 ]]; then
            echo "::error::Expected exactly one WR30U 25.12 sysupgrade.itb, found $image_count."
            exit 1
          fi
          (cd "$release_dir" && sha256sum *sysupgrade.itb > sha256sums)
          source_short="${SOURCE_COMMIT:0:10}"
          release_tag="25.12-test-${source_short}-wr30u-${GITHUB_RUN_NUMBER}"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish Chinese prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.release_tag }}
          name: ImmortalWrt 25.12 WR30U 测试固件 ${{ steps.collect.outputs.release_tag }}
          prerelease: true
          body: |
            ## 测试固件信息

            - 状态：**预发布测试版，不替代现有 24.10 稳定固件**
            - 上游源码：`${{ env.REPO_URL }}`
            - 源码分支：`${{ env.REPO_BRANCH }}`
            - 源码提交：`${{ needs.resolve-source.outputs.source_commit }}`
            - 适用设备：小米 WR30U
            - 分区布局：OpenWrt U-Boot Mod
            - 固件格式：`sysupgrade.itb`（FIT 外置 rootfs）
            - 默认管理地址：`192.168.2.1`
            - 内置组件：HomeProxy、drill、mtr-nojson、iperf3
            - UPnP：未编译

            ## 重要警告

            本分支的 WR30U 镜像布局与现有 24.10 `sysupgrade.bin` 不同。尚未完成真机启动、保留配置升级和回退验证前，**不要在日常使用的路由器上直接保留配置升级**。测试前必须确认 U-Boot 恢复入口可用，并单独备份现有配置。

            Release 只包含一份 WR30U `sysupgrade.itb` 和 `sha256sums`；不提供 Actions artifact。
          files: ${{ steps.collect.outputs.release_dir }}/*
          fail_on_unmatched_files: true

      - name: Record successfully built 25.12 revision
        if: success()
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          printf '%s\n' "$SOURCE_COMMIT" > config/upstream-25.12.commit
          if git diff --quiet -- config/upstream-25.12.commit; then
            echo "25.12 source revision is already recorded."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/upstream-25.12.commit
          git commit -m "Record built 25.12 upstream ${SOURCE_COMMIT:0:10}"
          git push origin "HEAD:$GITHUB_REF_NAME"
