name: Build ImmortalWrt WR30U

on:
  schedule:
    # Check upstream once per day at 03:17 Asia/Shanghai (19:17 UTC).
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wr30u-upstream-build
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  check-upstream:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v4

      - name: Resolve upstream revision
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print $1}')"
          recorded_commit="$(tr -d '[:space:]' < config/upstream.commit)"
          test -n "$source_commit"
          test -n "$recorded_commit"

          should_build=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$source_commit" != "$recorded_commit" ]]; then
            should_build=true
          fi

          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "Recorded upstream: $recorded_commit"
          echo "Current upstream:  $source_commit"
          echo "Build required:     $should_build"

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip-full \
            patch pkgconf python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -hT

      - name: Clone pinned upstream source
        env:
          SOURCE_COMMIT: ${{ needs.check-upstream.outputs.source_commit }}
        run: |
          git init openwrt
          git -C openwrt remote add origin "$REPO_URL"
          git -C openwrt fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Apply source customization
        run: bash diy-part1.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate and validate configuration
        run: |
          cd openwrt
          perl scripts/kconfig.pl + \
            defconfig/mt7981-ax3000.config \
            "$GITHUB_WORKSPACE/config/custom.config" > .config
          bash "$GITHUB_WORKSPACE/diy-part2.sh" "$PWD"
          sha256sum .config
          if ! cmp -s .config "$GITHUB_WORKSPACE/.config"; then
            echo "::warning::Generated .config differs from the committed snapshot; run scripts/refresh-config.sh after this upstream update."
          fi

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete

      - name: Compile firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect release firmware
        id: collect
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.check-upstream.outputs.source_commit }}
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/openwrt/bin/targets/mediatek/filogic"
          release_dir="$GITHUB_WORKSPACE/release"
          device_prefix="immortalwrt-mediatek-filogic-xiaomi_mi-router-wr30u-ubootmod"
          test -d "$output_dir"
          mkdir -p "$release_dir"
          find "$output_dir" -maxdepth 1 -type f -name "${device_prefix}*" \
            \( -name '*.bin' -o -name '*.ubi' -o -name '*.itb' -o -name '*.fip' \) \
            -exec cp -t "$release_dir" -- {} +
          if ! find "$release_dir" -maxdepth 1 -type f -name '*sysupgrade*' -print -quit | grep -q .; then
            echo "::error::No sysupgrade firmware image was produced."
            exit 1
          fi
          (cd "$release_dir" && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > sha256sums)
          source_short="${SOURCE_COMMIT:0:10}"
          release_tag="24.10-${source_short}-wr30u-${GITHUB_RUN_NUMBER}"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.release_tag }}
          name: ImmortalWrt WR30U 固件 ${{ steps.collect.outputs.release_tag }}
          body: |
            ## 固件信息

            - 上游源码：`${{ env.REPO_URL }}`
            - 源码分支：`${{ env.REPO_BRANCH }}`
            - 源码提交：`${{ needs.check-upstream.outputs.source_commit }}`
            - 适用设备：小米 WR30U
            - 分区布局：U-Boot Mod
            - 默认管理地址：`192.168.2.1`
            - 内置组件：HomeProxy、drill、mtr-nojson、iperf3

            ## 下载与校验

            日常升级请使用文件名中带有 `squashfs-sysupgrade` 的固件。刷写前请使用 `sha256sums` 核对文件完整性。

            **警告：本固件仅适用于 U-Boot Mod 分区布局，不得刷入原厂分区布局。**
          files: ${{ steps.collect.outputs.release_dir }}/*
          fail_on_unmatched_files: true

      - name: Record successfully built upstream revision
        if: success()
        env:
          SOURCE_COMMIT: ${{ needs.check-upstream.outputs.source_commit }}
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          printf '%s\n' "$SOURCE_COMMIT" > config/upstream.commit
          if git diff --quiet -- config/upstream.commit; then
            echo "Upstream revision is already recorded."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/upstream.commit
          git commit -m "Record built upstream ${SOURCE_COMMIT:0:10}"
          git push origin "HEAD:$GITHUB_REF_NAME"
