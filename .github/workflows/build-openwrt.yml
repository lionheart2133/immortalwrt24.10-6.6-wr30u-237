name: Build ImmortalWrt WR30U

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wr30u-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip-full \
            patch pkgconf python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -hT

      - name: Clone upstream source
        run: |
          git clone --branch "$REPO_BRANCH" --single-branch --filter=blob:none \
            "$REPO_URL" openwrt
          git -C openwrt rev-parse HEAD

      - name: Apply source customization
        run: bash diy-part1.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate and validate configuration
        run: |
          cd openwrt
          perl scripts/kconfig.pl + \
            defconfig/mt7981-ax3000.config \
            "$GITHUB_WORKSPACE/config/custom.config" > .config
          bash "$GITHUB_WORKSPACE/diy-part2.sh" "$PWD"
          sha256sum .config
          if ! cmp -s .config "$GITHUB_WORKSPACE/.config"; then
            echo "::warning::Generated .config differs from the committed snapshot; run scripts/refresh-config.sh after this upstream update."
          fi

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete

      - name: Compile firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware and reproducibility metadata
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/openwrt/bin/targets/mediatek/filogic"
          test -d "$output_dir"
          cp openwrt/.config "$output_dir/config.full"
          (cd openwrt && ./scripts/diffconfig.sh) > "$output_dir/config.diff"
          {
            echo "source_url=$REPO_URL"
            echo "source_branch=$REPO_BRANCH"
            echo "source_commit=$(git -C openwrt rev-parse HEAD)"
            echo "luci_commit=$(git -C openwrt/feeds/luci rev-parse HEAD)"
            echo "packages_commit=$(git -C openwrt/feeds/packages rev-parse HEAD)"
            echo "config_snapshot_sha256=$(sha256sum openwrt/.config | cut -d' ' -f1)"
          } > "$output_dir/build-metadata.txt"
          (cd "$output_dir" && find . -maxdepth 1 -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt)
          release_tag="$(date +'%Y.%m.%d-%H%M')-wr30u-ubootmod"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-wr30u-ubootmod-${{ github.run_number }}
          path: |
            ${{ steps.collect.outputs.output_dir }}
            !${{ steps.collect.outputs.output_dir }}/packages/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.release_tag }}
          name: ImmortalWrt WR30U ${{ steps.collect.outputs.release_tag }}
          body: |
            Device: Xiaomi WR30U (U-Boot Mod layout)
            Default LAN: 192.168.2.1
            Included customization: HomeProxy

            Verify sha256sums.txt before flashing. Do not flash this image on the stock partition layout.
          files: ${{ steps.collect.outputs.output_dir }}/*.*
